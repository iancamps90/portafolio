<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D0D0D;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60A5FA;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60A5FA;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="50" fill="url(#logoGradient)" opacity="0.1"/>
  <circle cx="1100" cy="530" r="80" fill="url(#logoGradient)" opacity="0.1"/>
  <circle cx="1000" cy="100" r="30" fill="url(#logoGradient)" opacity="0.2"/>
  <circle cx="200" cy="500" r="40" fill="url(#logoGradient)" opacity="0.15"/>
  
  <!-- Main logo -->
  <rect x="100" y="200" width="120" height="120" rx="20" fill="url(#logoGradient)"/>
  <text x="160" y="270" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="white">IC</text>
  
  <!-- Main title -->
  <text x="300" y="250" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="url(#textGradient)">Ian Camps Dev</text>
  
  <!-- Subtitle -->
  <text x="300" y="320" font-family="Arial, sans-serif" font-size="32" fill="#E5E7EB">Desarrollo Web y Automatización Profesional</text>
  
  <!-- Description -->
  <text x="300" y="380" font-family="Arial, sans-serif" font-size="24" fill="#9CA3AF">Desarrollo web Full Stack • Automatización de procesos • Dashboards con Power BI</text>
  
  <!-- Tech stack -->
  <text x="300" y="450" font-family="Arial, sans-serif" font-size="20" fill="#6B7280">React • Next.js • TypeScript • Django • Python • Zapier • Power BI</text>
  
  <!-- Website URL -->
  <text x="300" y="520" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="url(#textGradient)">iancamps.dev</text>
  
  <!-- Decorative code brackets -->
  <text x="950" y="200" font-family="monospace" font-size="120" fill="url(#logoGradient)" opacity="0.3">{</text>
  <text x="1050" y="400" font-family="monospace" font-size="120" fill="url(#logoGradient)" opacity="0.3">}</text>
</svg>
